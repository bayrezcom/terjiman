server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # The page is one file plus two images — compress the HTML, let the
    # already-compressed PNGs through untouched.
    gzip              on;
    gzip_types        text/html text/css application/javascript image/svg+xml;
    gzip_min_length   512;

    # No inline user content and no third-party scripts: the only external
    # origin the page needs is Google Fonts.
    add_header X-Content-Type-Options   "nosniff"                    always;
    add_header X-Frame-Options          "SAMEORIGIN"                 always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;

    location = /index.html {
        # Always revalidate the entry point so a redeploy is picked up at once.
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(png|jpg|svg|ico|webp)$ {
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
